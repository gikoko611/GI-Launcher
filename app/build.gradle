plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.gikoko.launcher'
    compileSdk 34

    defaultConfig {
        applicationId 'com.gikoko.launcher'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.0.1'
    }

    def ksFile = file('ci.keystore')
    signingConfigs {
        ci {
            if (ksFile.exists()) {
                storeFile ksFile
                storePassword 'gikoko2026'
                keyAlias 'gikoko'
                keyPassword 'gikoko2026'
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (ksFile.exists()) {
                signingConfig signingConfigs.ci
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
}
